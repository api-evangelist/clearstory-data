description: Clearstory Data was a big-data analytics startup (Menlo Park / Mountain View, CA) that built
  a cloud service for blending and visualizing enterprise and third-party data, backed by a16z, GV (Google
  Ventures), Kleiner Perkins and Khosla Ventures. It was acquired by Alteryx in 2016 and is no longer an
  independent company. Its former domain (clearstorydata.com) has lapsed and now 301-redirects to unrelated
  parked/spam sites, so it publishes no developer portal, documentation, or API. Retained in the API
  Evangelist network as a historical/defunct portfolio record; no live artifacts are producible.
